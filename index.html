<!doctype html>
<html lang="ko">
<head>
  <script type="module" src="/@vite/client"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BalanceLab — 스마트 대사·식단 코치</title>
  <meta name="description" content="식단·식사순서 분석, 체형별 유·무산소 배분, 다종목 운동, 옷 핏·격투기 팁, 주변 헬스장·식당 가이드, 폭식 리밸런싱을 제공하는 단일 HTML 다이어트·건강 코칭 앱" />
  <meta property="og:title" content="BalanceLab — 스마트 대사·식단 코치" />
  <meta property="og:description" content="식단·식사순서 분석, 체형별 유·무산소 배분, 다종목 운동, 옷 핏·격투기 팁, 주변 헬스장·식당 가이드, 폭식 리밸런싱을 제공하는 단일 HTML 다이어트·건강 코칭 앱" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.96);
      --bg-soft: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --teal-700: #0f766e;
      --teal-800: #115e59;
      --teal-600: #0d9488;
      --teal-50: #f0fdfa;
      --teal-200: #99f6e4;
      --emerald-700: #047857;
      --emerald-600: #059669;
      --emerald-50: #ecfdf5;
      --emerald-200: #a7f3d0;
      --amber-700: #b45309;
      --amber-800: #92400e;
      --amber-50: #fffbeb;
      --amber-200: #fde68a;
      --red-700: #b91c1c;
      --red-600: #dc2626;
      --red-50: #fef2f2;
      --red-200: #fecaca;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
      --font-sans: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--text-main);
      background: var(--bg-page);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background 0.45s ease;
    }

    /* 5 Dynamic Rank Themes */
    body[data-theme="tier1_slate"] {
      background: #f8fafc;
      --header-bg: #ffffff;
      --header-border: #e2e8f0;
      --quote-bg: rgba(255, 255, 255, 0.88);
      --quote-border: #e2e8f0;
      --rank-bg: #fffbeb;
      --rank-border: #fde68a;
      --rank-text: #92400e;
      --rank-bar: #d97706;
    }
    body[data-theme="tier2_mint"] {
      background: radial-gradient(ellipse at top right, #d1fae5 0%, #f0fdfa 38%, #f8fafc 100%);
      --header-bg: linear-gradient(90deg, #ffffff 0%, #ecfdf5 50%, #ffffff 100%);
      --header-border: #a7f3d0;
      --quote-bg: rgba(236, 253, 245, 0.85);
      --quote-border: #a7f3d0;
      --rank-bg: #ecfdf5;
      --rank-border: #a7f3d0;
      --rank-text: #065f46;
      --rank-bar: #059669;
    }
    body[data-theme="tier3_gold"] {
      background: radial-gradient(ellipse at top left, #fef3c7 0%, #ecfdf5 42%, #f8fafc 100%);
      --header-bg: linear-gradient(90deg, #fffbeb 0%, #ffffff 50%, #f0fdfa 100%);
      --header-border: #fcd34d;
      --quote-bg: linear-gradient(90deg, rgba(255, 251, 235, 0.9), rgba(255, 255, 255, 0.9), rgba(236, 253, 245, 0.9));
      --quote-border: #fcd34d;
      --rank-bg: #fef3c7;
      --rank-border: #fcd34d;
      --rank-text: #78350f;
      --rank-bar: linear-gradient(90deg, #f59e0b, #0d9488);
    }
    body[data-theme="tier4_sapphire"] {
      background: radial-gradient(circle at 15% 10%, #bae6fd 0%, #ccfbf1 34%, #eef2ff 72%, #f8fafc 100%);
      --header-bg: linear-gradient(90deg, #f0f9ff 0%, #ffffff 50%, #f0fdfa 100%);
      --header-border: #7dd3fc;
      --quote-bg: linear-gradient(90deg, rgba(240, 249, 255, 0.92), rgba(240, 253, 250, 0.9), rgba(238, 242, 255, 0.9));
      --quote-border: #bae6fd;
      --rank-bg: #f0f9ff;
      --rank-border: #bae6fd;
      --rank-text: #0c4a6e;
      --rank-bar: linear-gradient(90deg, #0284c7, #0d9488);
    }
    body[data-theme="tier5_aurora"] {
      background: radial-gradient(ellipse at top left, #ddd6fe 0%, #a7f3d0 32%, #bae6fd 68%, #fef3c7 100%);
      --header-bg: linear-gradient(90deg, rgba(245, 243, 255, 0.92) 0%, rgba(255, 255, 255, 0.96) 50%, rgba(236, 253, 245, 0.92) 100%);
      --header-border: #c4b5fd;
      --quote-bg: linear-gradient(90deg, rgba(245, 243, 255, 0.92), rgba(240, 253, 250, 0.92), rgba(255, 251, 235, 0.92));
      --quote-border: #ddd6fe;
      --rank-bg: #f5f3ff;
      --rank-border: #ddd6fe;
      --rank-text: #4c1d95;
      --rank-bar: linear-gradient(90deg, #7c3aed, #14b8a6, #f59e0b);
    }

    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .num { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* App Layout */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    .brand-row { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 18px; }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-main); white-space: nowrap; }

    .rank-card {
      background: var(--rank-bg);
      border: 1px solid var(--rank-border);
      border-radius: var(--radius-lg);
      padding: 12px;
      margin-bottom: 16px;
    }
    .rank-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; color: var(--rank-text); }
    .rank-xp { font-family: var(--font-mono); font-size: 11px; color: var(--text-sub); font-weight: 600; }
    .progress-track { height: 7px; border-radius: 6px; background: rgba(226, 232, 240, 0.75); overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; border-radius: 6px; background: var(--rank-bar); transition: width 0.3s ease; }
    .rank-next-note { font-size: 11px; color: var(--text-sub); margin-top: 6px; font-variant-numeric: tabular-nums; }

    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      text-align: left;
      cursor: pointer;
      min-height: 44px;
      font-family: inherit;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-btn:hover { background: #f1f5f9; color: var(--text-main); }
    .nav-btn.active { background: var(--teal-50); color: #134e4a; font-weight: 600; border-color: #ccfbf1; }
    .nav-btn svg { flex-shrink: 0; color: #94a3b8; }
    .nav-btn.active svg { color: var(--teal-700); }
    .nav-label { font-size: 13.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-foot { border-top: 1px solid var(--border); padding: 14px 8px 0; margin-top: 16px; }
    .sidebar-foot-title { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .sidebar-foot-user { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; gap: 8px; }
    .sidebar-foot-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .sidebar-foot-meta { font-size: 12px; color: var(--text-sub); font-family: var(--font-mono); }
    .sidebar-foot-kcal { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .sidebar-foot-kcal strong { color: var(--teal-700); font-family: var(--font-mono); }

    /* Top Header & Quote Strip */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 28px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      backdrop-filter: blur(8px);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
    .crumb-brand { color: #94a3b8; font-weight: 500; white-space: nowrap; }
    .crumb-sep { color: #cbd5e1; }
    .crumb-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-rank { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--rank-text); margin-left: 8px; white-space: nowrap; }

    .quote-bar {
      background: var(--quote-bg);
      border-bottom: 1px solid var(--quote-border);
      padding: 10px 28px;
    }
    .quote-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .quote-text { margin: 0; font-size: 13px; font-weight: 500; color: #334155; line-height: 1.45; }
    .quote-tag { font-weight: 700; color: var(--teal-700); margin-right: 8px; }

    .main-container { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 28px 40px; }

    /* Cards & Surfaces (strictly single elevation, hairline borders) */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }
    .card-flush { padding: 0; overflow: hidden; }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
    }
    .section-title { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-main); }
    .section-sub { margin: 4px 0 0; font-size: 13px; color: var(--text-sub); line-height: 1.5; }
    .sub-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-main); }
    .micro-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    .stack { display: flex; flex-direction: column; gap: 22px; }
    .stack-sm { display: flex; flex-direction: column; gap: 12px; }

    /* Grids */
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .grid-split-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 22px; align-items: start; }
    .grid-split-3-2 { display: grid; grid-template-columns: 3fr 2fr; gap: 22px; align-items: start; }
    .grid-split-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 22px; align-items: start; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 14px;
      min-height: 38px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: #f1f5f9; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn-primary { background: var(--teal-700); border-color: var(--teal-700); color: #ffffff; }
    .btn-primary:hover:not(:disabled) { background: var(--teal-800); border-color: var(--teal-800); }
    .btn-dark { background: #0f172a; border-color: #0f172a; color: #ffffff; }
    .btn-dark:hover:not(:disabled) { background: #1e293b; }
    .btn-done { background: var(--emerald-700); border-color: var(--emerald-700); color: #ffffff; }
    .btn-sm { min-height: 32px; padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 7px; min-height: 34px; color: var(--text-muted); }
    .btn-icon:hover { color: var(--red-600); background: #fee2e2; border-color: #fecaca; }

    .hamburger-btn { display: none; }

    /* Segmented Tabs & Choice Cards */
    .seg-bar { display: inline-flex; flex-wrap: wrap; gap: 4px; background: #e2e8f0; padding: 4px; border-radius: var(--radius-md); }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .seg-btn:hover { color: var(--text-main); }
    .seg-btn.active { background: #ffffff; color: var(--text-main); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }

    .choice-card {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .choice-card:hover { background: #f8fafc; }
    .choice-card.active { border-color: var(--teal-700); background: rgba(240, 253, 250, 0.72); }

    /* Banners */
    .banner {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13px;
    }
    .banner-teal { border-color: #99f6e4; background: rgba(240, 253, 250, 0.85); color: #134e4a; }
    .banner-amber { border-color: #fde68a; background: rgba(255, 251, 235, 0.92); color: #78350f; }
    .banner-red { border-color: #fecaca; background: #fef2f2; color: #991b1b; }

    /* KPI Box */
    .kpi-value { font-size: 25px; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-main); line-height: 1.2; }
    .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 8px; font-variant-numeric: tabular-nums; }

    /* Forms & Inputs */
    .field-label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #ffffff;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13.5px;
      padding: 9px 12px;
      transition: border-color 0.15s ease;
    }
    .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--teal-600); }
    .range { width: 100%; accent-color: var(--teal-700); cursor: pointer; }

    /* Tables & Hairline Lists */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: #ffffff; }
    .table-wrap-flush { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    th {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }
    td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .text-right { text-align: right; }

    .hairline-list { border: 1px solid var(--border); border-radius: var(--radius-md); background: #ffffff; }
    .hairline-item { padding: 13px 15px; border-bottom: 1px solid var(--border); }
    .hairline-item:last-child { border-bottom: none; }

    /* Stacked Ratio Bar */
    .ratio-bar { height: 12px; border-radius: 6px; background: #e2e8f0; overflow: hidden; display: flex; }
    .ratio-seg { height: 100%; transition: width 0.25s ease; }

    /* Modal & Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-panel {
      width: 100%;
      max-width: 700px;
      max-height: 88vh;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 35px rgba(15, 23, 42, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-body { padding: 20px 22px; overflow-y: auto; }

    .mobile-drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
    }
    .mobile-drawer-backdrop .sidebar {
      position: relative;
      height: 100%;
      width: 280px;
      max-width: 85vw;
      z-index: 56;
    }

    /* Dropzone & Preview */
    .dropzone {
      width: 100%;
      height: 196px;
      border: 1.5px dashed #cbd5e1;
      border-radius: var(--radius-md);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-sub);
      padding: 16px;
      text-align: center;
      font-family: inherit;
    }
    .dropzone:hover { background: #f1f5f9; border-color: var(--teal-600); }
    .img-box { position: relative; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: #f1f5f9; }
    .img-box img, .img-box video { width: 100%; height: 196px; object-fit: cover; display: block; }

    /* Toast */
    .toast-box {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #0f172a;
      color: #ffffff;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
      max-width: 340px;
    }

    /* District Interactive SVG Radar */
    .map-svg-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #f8fafc;
      overflow: hidden;
    }
    .map-node { cursor: pointer; transition: transform 0.15s ease; }

    /* Color text helpers */
    .txt-teal { color: var(--teal-700); }
    .txt-green { color: var(--emerald-700); }
    .txt-amber { color: var(--amber-700); }
    .txt-red { color: var(--red-700); }
    .txt-muted { color: var(--text-muted); }
    .txt-sub { color: var(--text-sub); }
    .swatch-box { height: 28px; border-radius: 6px; border: 1px solid rgba(148, 163, 184, 0.35); }

    @media (max-width: 1120px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-split-2-1, .grid-split-3-2, .grid-split-1-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 960px) {
      .desktop-sidebar { display: none; }
      .hamburger-btn { display: inline-flex; }
      .topbar, .quote-bar, .main-container { padding-left: 16px; padding-right: 16px; }

      /* --- Metabolic & Gamification Formulas --- */
      function calculateBMR(p) {
        var base = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age;
        return Math.round(p.gender === "male" ? base + 5 : base - 161);
      }

      function calculateSafeTargets(p) {
        var bmr = calculateBMR(p);
        var mult = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725 }[p.activityLevel] || 1.375;
        var tdee = Math.round(bmr * mult);
        var isTeen = p.age < 20;
        var safeMin = isTeen ? Math.max(1500, Math.round(bmr * 1.05)) : Math.max(1200, bmr);
        var deltas = {
          gentle_loss: isTeen ? -250 : -300,
          steady_loss: isTeen ? -350 : -500,
          recomp: -150,
          maintain: 0,
          muscle_gain: 280
        };
        var raw = tdee + (deltas[p.goalMode] || -250);
        var safetyTriggered = raw < safeMin;
        var rec = Math.max(safeMin, raw);
        var pMult = p.goalMode === "muscle_gain" ? 1.75 : p.goalMode === "recomp" ? 1.6 : 1.45;
        var proteinTargetG = Math.round(p.weightKg * pMult);
        var fatCal = Math.round(rec * 0.25);
        var fatTargetG = Math.round(fatCal / 9);
        var carbsTargetG = Math.round(Math.max(200, rec - proteinTargetG * 4 - fatCal) / 4);
        return {
          bmr: bmr, tdee: tdee, recommendedCalories: rec, safeMinimumCalories: safeMin,
          isTeen: isTeen, safetyTriggered: safetyTriggered,
          proteinTargetG: proteinTargetG, carbsTargetG: carbsTargetG, fatTargetG: fatTargetG,
          sugarLimitG: isTeen ? 35 : 30, sodiumLimitMg: 2000, fiberTargetG: 25
        };
      }

      function simulateGlucoseCurve(carbs, fiber, protein) {
        var base = 88;
        var netCarbs = Math.max(10, carbs - fiber * 0.4);
        var stdAmp = Math.min(95, 22 + netCarbs * 0.72);
        var revAmp = stdAmp * (1 - (0.14 + Math.min(0.22, fiber * 0.015) + Math.min(0.16, protein * 0.005)));
        var walkAmp = revAmp * 0.84;
        var pts = [];
        for (var t = 0; t <= 180; t += 15) {
          var s1 = t === 0 ? 0 : Math.pow(t / 45, 1.45) * Math.exp(1.45 * (1 - t / 45));
          var s2 = t === 0 ? 0 : Math.pow(t / 58, 1.35) * Math.exp(1.35 * (1 - t / 58));
          var s3 = t === 0 ? 0 : Math.pow(t / 50, 1.25) * Math.exp(1.25 * (1 - t / 50)) * Math.exp(-t / 280);
          pts.push({
            minute: t,
            standard: Math.round(base + stdAmp * s1),
            reverse: Math.round(base + revAmp * s2),
            walk: Math.round(base + walkAmp * s3)
          });
        }
        var stdPeak = Math.max.apply(null, pts.map(function (x) { return x.standard; }));
        var revPeak = Math.max.apply(null, pts.map(function (x) { return x.reverse; }));
        var walkPeak = Math.max.apply(null, pts.map(function (x) { return x.walk; }));
        var redPct = Math.round(((stdPeak - base - (walkPeak - base)) / Math.max(1, stdPeak - base)) * 100);
        return {
          points: pts, standardPeak: stdPeak, reversePeak: revPeak, walkPeak: walkPeak,
          spikeReductionPct: redPct,
          drowsiness: walkPeak >= 145 ? "보통 (탄수화물 비중 소폭 조절 권장)" : "낮음 (집중력 유지 구간)"
        };
      }

      function projectEightWeekWeight(currKg, tdee, targetKcal, goalKg) {
        var def = tdee - targetKcal;
        var wkDelta = (def * 7 * 0.9) / 7700;
        var out = [];
        for (var w = 0; w <= 8; w++) {
          var p = currKg - wkDelta * w;
          var b = def >= 0 ? Math.max(goalKg, p) : Math.min(Math.max(goalKg, currKg + 4), p);
          out.push({ week: w, weightKg: b.toFixed(1) });
        }
        return out;
      }

      function calculateExerciseSplit(bodyType, goal, mins) {
        var baseMap = {
          upper_belly: [45, 45, 10],
          lower_edema: [40, 35, 25],
          skinny_fat: [70, 20, 10],
          balanced_loss: [45, 45, 10],
          sedentary_posture: [45, 25, 30]
        };
        var arr = (baseMap[bodyType] || [45, 45, 10]).slice();
        var an = arr[0], ae = arr[1], mo = arr[2];
        if (goal === "muscle_build") { an = Math.min(80, an + 15); ae = Math.max(10, ae - 15); }
        else if (goal === "stamina_up") { ae = Math.min(65, ae + 15); an = Math.max(25, an - 10); mo = 100 - an - ae; }
        else if (goal === "posture_health") { mo = Math.min(40, mo + 10); ae = Math.max(15, ae - 10); }
        else if (goal === "fat_loss" && bodyType !== "skinny_fat") { ae = Math.min(55, ae + 5); an = 100 - ae - mo; }
        if (an + ae + mo !== 100) an += 100 - (an + ae + mo);

        var strMin = Math.max(5, Math.round((mins * an) / 100));
        var carMin = Math.max(3, Math.round((mins * ae) / 100));
        var mobMin = Math.max(2, mins - strMin - carMin);
        var rationales = {
          upper_belly: "복부·내장지방 관리를 위해 대근육 무산소로 기초대사량을 지키면서 중강도 유산소를 균형 있게 배분합니다.",

          balanced_loss: "전신 대근육 무산소와 유산소를 조화롭게 배분해 심폐지구력과 체지방 연소를 동시에 끌어올립니다.",

        };
        return {
          anaerobicPct: an, aerobicPct: ae, mobilityPct: mo,
          weeklyRatioLabel: an >= 60 ? "주 4일 무산소 중심 + 주 2일 가벼운 유산소" : ae >= 45 ? "주 3일 무산소·유산소 병행 + 주 2일 유산소" : "주 3일 체형 교정·근력 + 매일 10~15분 순환 유산소",
          rationale: rationales[bodyType],
          sessionBreakdown: mins + "분 기준: 무산소(근력) " + strMin + "분 · 유산소 " + carMin + "분 · 가동성/정리 " + mobMin + "분",
          strMin: strMin, carMin: carMin, mobMin: mobMin
        };
      }

      function calculateRankProgress(meals, habitsMap, completedSessions, dailyWorkouts) {
        var totalMeals = meals.length;
        var reverseMeals = meals.filter(function (m) { return m.eatingOrder === "거꾸로 식사(채소→단백질→탄수)"; }).length;
        var vals = Object.keys(habitsMap).map(function (k) { return habitsMap[k]; });
        var waterDays = vals.filter(function (h) { return h.waterMl >= 1000; }).length;
        var walkDays = vals.filter(function (h) { return h.walkMinutes >= 15; }).length;
        var sessCount = Object.keys(completedSessions).filter(function (k) { return completedSessions[k]; }).length;
        var varCount = dailyWorkouts.length;
        var totalXp = totalMeals * 15 + reverseMeals * 20 + waterDays * 15 + walkDays * 20 + sessCount * 30 + varCount * 25;
        var currentTier = RANK_TIERS[0];
        for (var i = 0; i < RANK_TIERS.length; i++) {
          if (totalXp >= RANK_TIERS[i].minXp) currentTier = RANK_TIERS[i];
        }
        var nextTier = RANK_TIERS[currentTier.level] || null;
        var pct = 100, xpToNext = 0;
        if (nextTier) {
          pct = Math.min(100, Math.max(0, Math.round(((totalXp - currentTier.minXp) / (nextTier.minXp - currentTier.minXp)) * 100)));
          xpToNext = Math.max(0, nextTier.minXp - totalXp);
        }
        return { totalXp: totalXp, currentTier: currentTier, nextTier: nextTier, progressToNextPct: pct, xpToNext: xpToNext };
      }

      function getDailyMultiExerciseCombo(bodyType, shuffleOffset) {
        var now = new Date();
        var seed = now.getFullYear() * 372 + (now.getMonth() + 1) * 31 + now.getDate() + (shuffleOffset || 0) * 5;
        var matched = EXERCISE_VARIETY_CATALOG.filter(function (x) { return x.bestFor.indexOf(bodyType) !== -1; });
        var others = EXERCISE_VARIETY_CATALOG.filter(function (x) { return x.bestFor.indexOf(bodyType) === -1; });
        var pool = matched.concat(others);
        var picked = [];
        var usedGenres = {};
        for (var i = 0; i < pool.length && picked.length < 4; i++) {
          var c = pool[(seed + i * 3) % pool.length];
          if (!usedGenres[c.genre] && picked.indexOf(c) === -1) {
            picked.push(c);
            usedGenres[c.genre] = true;
          }
        }
        for (var j = 0; j < pool.length && picked.length < 4; j++) {
          var c2 = pool[(seed + j) % pool.length];
          if (picked.indexOf(c2) === -1) picked.push(c2);
        }
        return picked;
      }

      function recommendClothingFit(heightCm, weightKg, gender, bodyType) {
        var hM = Math.max(1.3, heightCm / 100);
        var bmi = weightKg / (hM * hM);
        var topIdx = 2;
        if (gender === "male") {
          if (weightKg < 58 && heightCm < 170) topIdx = 1;
          else if (weightKg < 68 && heightCm < 176) topIdx = 2;
          else if (weightKg < 78 && heightCm < 182) topIdx = 3;
          else if (weightKg < 88) topIdx = 4;

      function generateMuscleGuideLocally(goalText, bodyTypeKey, env) {
        var areaKey = "arms";
        if (/어깨|등|광배|승모|거북목/.test(goalText)) areaKey = "shoulders_back";
        else if (/복근|배|코어|허리|옆구리/.test(goalText)) areaKey = "core_abs";
        else if (/다리|하체|엉덩이|힙|허벅지|종아리/.test(goalText)) areaKey = "legs_glutes";
        else if (/가슴|대흉근|푸쉬업/.test(goalText)) areaKey = "chest";

        var prof = TARGET_MUSCLE_PROFILES.filter(function (p) { return p.key === areaKey; })[0];
        var adj = prof.byBody[bodyTypeKey];
        var bodyObj = BODY_TYPES.filter(function (b) { return b.key === bodyTypeKey; })[0];
        return {
          bodyTypeTitle: bodyObj.title,
          targetAreaTitle: prof.title,
          whyThisSelectionForBodyType: adj.strategy + " (" + env + " 기준 선별)",
          keyMusclesToTrain: prof.muscles,
          recommendedExercises: adj.ex,
          recoveryAndNutritionTip: "근육 보강을 위해서는 운동 후 2시간 이내에 단백질 25~30g(달걀·두유·닭가슴살)과 수분을 섭취하고, 같은 부위는 최소 48시간 회복 후 다시 훈련하세요."

        saveStore(STORAGE_KEYS.profile, state.profile);

      function getContext() {
        var today = todayDateStr();
        var todayMeals = state.meals.filter(function (m) { return m.date === today; });
        var todayHabits = state.habitsMap[today] || { date: today, waterMl: 0, walkMinutes: 0 };
        var targets = calculateSafeTargets(state.profile);
        var todayCal = todayMeals.reduce(function (s, m) { return s + m.totalCalories; }, 0);
        var todayProt = todayMeals.reduce(function (s, m) { return s + m.totalProteinG; }, 0);
        var rank = calculateRankProgress(state.meals, state.habitsMap, state.completedSessions, state.dailyWorkouts);
        var visualTheme = state.selectedTheme === "auto"
          ? rank.currentTier
          : (RANK_TIERS.filter(function (t) { return t.themeId === state.selectedTheme; })[0] || rank.currentTier);
        var todayVarietyIds = state.dailyWorkouts.filter(function (w) { return w.date === today; }).map(function (w) { return w.id; });
        return {
          today: today, todayMeals: todayMeals, todayHabits: todayHabits, targets: targets,
          todayCal: todayCal, todayProt: todayProt,
          remCal: targets.recommendedCalories - todayCal,
          remProt: Math.max(0, targets.proteinTargetG - todayProt),
          rank: rank, visualTheme: visualTheme, todayVarietyIds: todayVarietyIds
        };
      }

        persistAll();
        showToast("수분 +" + ml + "ml 기록 완료");
        renderAll();

      /* --- Tab 6: Smart Swaps --- */
      function renderSwaps(ctx) {
        var cats = ["전체", "편의점", "학교 급식", "시험기간 야식", "카페 음료"];

        var cs = state.customSwapsResult;
        var csHtml = cs ? (
          '<div style="border-top:1px solid var(--border);padding-top:16px" class="stack-sm"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px"><span>비교 기준: <strong>' + escapeHtml(cs.originalEstimate.name) + '</strong></span><span class="mono txt-muted">' + cs.originalEstimate.calories + " kcal · 당류 " + cs.originalEstimate.sugarG + "g · 단백질 " + cs.originalEstimate.proteinG + "g</span></div>" +

            return '<div class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:12px"><div><div style="display:flex;justify-content:space-between;font-size:12px"><span class="txt-muted">' + escapeHtml(sw.placeTag) + '</span><span class="mono txt-teal" style="font-weight:700">-' + sw.calorieSaved + " kcal 절감</span></div>" +
              '<div style="font-size:14px;font-weight:700;margin-top:4px">' + escapeHtml(sw.title) + '</div><ul style="margin:8px 0;padding-left:18px;font-size:12.5px;color:#334155">' +
              sw.items.map(function (it) { return "<li>" + escapeHtml(it) + "</li>"; }).join("") +

              '<button type="button" class="btn btn-dark btn-sm" data-log-cswap="' + i + '">' + icon("plus", 13) + " 식단 기록</button></div></div>";
          }).join("") + "</div></div>"
        ) : "";

        return (
          '<div class="stack"><section class="card stack-sm"><div><h2 class="section-title">상황별 맞춤 스마트 스왑 파인더</h2>' +
          '<p class="section-sub">먹고 싶은 메뉴나 상황을 입력하면 오늘 남은 칼로리(<strong class="mono txt-teal">' + fmt(ctx.remCal) + " kcal</strong>)에 맞춘 한국 편의점·배달·집 대체 조합 3가지를 제안합니다.</p></div>" +
          '<form id="swap-form" style="display:flex;flex-wrap:wrap;gap:8px"><select id="swap-ctx-sel" class="select" style="width:170px">' +
          ["편의점", "학교 급식/매점", "시험기간 야식", "카페/디저트", "외식/배달"].map(function (c) {
            return '<option value="' + c + '" ' + (state.swapContext === c ? "selected" : "") + ">" + c + "</option>";
          }).join("") + "</select>" +
          '<input id="swap-craving-in" class="input" style="flex:1;min-width:220px" value="' + escapeHtml(state.cravingInput) + '" placeholder="예: 로제 떡볶이 먹고 싶어, 밤 11시 라면 땡겨" />' +

      /* --- Tab 7: Metabolic Lab & Weekly Report --- */
      function buildGlucoseSvgHtml(sim) {
        var W = 640, H = 220, pL = 42, pR = 16, pT = 16, pB = 28;
        var iW = W - pL - pR, iH = H - pT - pB;
        var toX = function (m) { return pL + (m / 180) * iW; };
        var toY = function (mg) { return pT + iH - ((mg - 70) / 125) * iH; };
        var pathFor = function (k) {
          return sim.points.map(function (pt, idx) {
            return (idx === 0 ? "M" : "L") + toX(pt.minute).toFixed(1) + "," + toY(pt[k]).toFixed(1);
          }).join(" ");
        };
        var grids = [80, 110, 140, 170].map(function (v) {
          return '<line x1="' + pL + '" x2="' + (W - pR) + '" y1="' + toY(v) + '" y2="' + toY(v) + '" stroke="#e2e8f0" ' + (v === 140 ? 'stroke-dasharray="4 4"' : "") + ' /><text x="' + (pL - 8) + '" y="' + (toY(v) + 4) + '" text-anchor="end" fill="#94a3b8" font-size="10" font-family="JetBrains Mono,monospace">' + v + "</text>";
        }).join("");
        var xTicks = [0, 30, 60, 90, 120, 150, 180].map(function (m) {
          return '<text x="' + toX(m) + '" y="' + (H - 6) + '" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="JetBrains Mono,monospace">' + m + "분</text>";
        }).join("");
        return (
          '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;min-width:440px" role="img" aria-label="혈당 변화 곡선">' +
          grids + xTicks +
          '<path d="' + pathFor("standard") + '" fill="none" stroke="#dc2626" stroke-width="2.5" />' +
          '<path d="' + pathFor("reverse") + '" fill="none" stroke="#d97706" stroke-width="2.5" />' +
          '<path d="' + pathFor("walk") + '" fill="none" stroke="#0f766e" stroke-width="3" /></svg>'
        );
      }

      function renderLab(ctx) {
        var sim = simulateGlucoseCurve(state.simCarbs, state.simFiber, state.simProtein);
        var curve8 = projectEightWeekWeight(state.profile.weightKg, ctx.targets.tdee, ctx.targets.recommendedCalories, state.profile.targetWeightKg);
        var last7 = [];
        for (var i = 0; i < 7; i++) {
          var ds = offsetDateStr(6 - i);
          var dm = state.meals.filter(function (m) { return m.date === ds; });
          last7.push({
            dateStr: ds, label: ds.slice(5),
            kcal: dm.reduce(function (s, m) { return s + m.totalCalories; }, 0),
            prot: dm.reduce(function (s, m) { return s + m.totalProteinG; }, 0),
            sugar: dm.reduce(function (s, m) { return s + m.totalSugarG; }, 0),
            cnt: dm.length,
            walk: (state.habitsMap[ds] && state.habitsMap[ds].walkMinutes) || 0
          });
        }
        var actDays = last7.filter(function (d) { return d.cnt > 0; });
        var avgKcal = Math.round(actDays.reduce(function (s, d) { return s + d.kcal; }, 0) / Math.max(1, actDays.length));
        var avgProt = Math.round(actDays.reduce(function (s, d) { return s + d.prot; }, 0) / Math.max(1, actDays.length));
        var totalRev = state.meals.filter(function (m) { return m.eatingOrder === "거꾸로 식사(채소→단백질→탄수)"; }).length;
        var revRate = Math.round((totalRev / Math.max(1, state.meals.length)) * 100);
        var totWalk = last7.reduce(function (s, d) { return s + d.walk; }, 0);
        var maxBar = Math.max(ctx.targets.recommendedCalories * 1.35, 2400);

        var mm = String(Math.floor(state.secondsLeft / 60)).padStart(2, "0");
        var ss = String(state.secondsLeft % 60).padStart(2, "0");
        var wi = state.weeklyInsight;

        return (
          '<div class="stack"><div class="grid-split-2-1">' +
          '<section class="card stack-sm"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">' +

          '<div class="grid-3" style="border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:12px 0">' +
          '<div><div style="display:flex;justify-content:space-between;font-size:12px"><span>식사 탄수화물</span><strong class="mono" id="sim-c-lbl">' + state.simCarbs + 'g</strong></div><input type="range" class="range" data-sim="carbs" min="20" max="140" step="5" value="' + state.simCarbs + '" /></div>' +
          '<div><div style="display:flex;justify-content:space-between;font-size:12px"><span>채소·식이섬유</span><strong class="mono" id="sim-f-lbl">' + state.simFiber + 'g</strong></div><input type="range" class="range" data-sim="fiber" min="0" max="20" step="1" value="' + state.simFiber + '" /></div>' +
          '<div><div style="display:flex;justify-content:space-between;font-size:12px"><span>단백질</span><strong class="mono" id="sim-p-lbl">' + state.simProtein + 'g</strong></div><input type="range" class="range" data-sim="protein" min="5" max="60" step="1" value="' + state.simProtein + '" /></div></div>' +
          '<div id="sim-svg-wrap" style="overflow-x:auto">' + buildGlucoseSvgHtml(sim) + "</div>" +
          '<div id="sim-legend" style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12px;border-top:1px solid var(--border);padding-top:10px">' +

          '<div>식곤증 위험: <strong class="txt-teal">' + sim.drowsiness + "</strong></div></div></section>" +

          '<section class="card stack-sm"><div><h2 class="sub-title">식후 대사 타이머</h2><div class="micro-label">식사 직후 10분 걷기 또는 20분 천천히 식사 습관을 실행하세요.</div></div>' +

          '<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" style="flex:1" id="btn-timer-toggle">' + icon(state.timerRunning ? "pause" : "play", 14) + " " + (state.timerRunning ? "일시정지" : "시작") + '</button><button type="button" class="btn" id="btn-timer-reset" aria-label="초기화">' + icon("refresh", 14) + "</button></div>" +

      function triggerBlobDownload(filename, content, mime) {
        var blob = new Blob([content], { type: mime });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }

      function buildCleanHtmlFallback() {
        var clone = document.documentElement.cloneNode(true);
        var clearIds = ["desktop-sidebar", "mobile-drawer", "main-content", "quick-modal", "toast-box", "quote-content", "topbar-rank"];
        clearIds.forEach(function (id) {
          var node = clone.querySelector("#" + id);
          if (node) node.innerHTML = "";
        });
        var titleEl = clone.querySelector("#topbar-title");
        if (titleEl) titleEl.textContent = "오늘의 대사 보드";
        var drawer = clone.querySelector("#mobile-drawer");
        if (drawer) drawer.className = "mobile-drawer-backdrop hidden";
        var modal = clone.querySelector("#quick-modal");
        if (modal) modal.className = "modal-backdrop hidden";
        var bodyEl = clone.querySelector("body");
        if (bodyEl) bodyEl.setAttribute("data-theme", "tier1_slate");
        return "<!DOCTYPE html>\n" + clone.outerHTML;
      }

      function downloadSourceHtml() {
        var done = function (htmlText) {
          triggerBlobDownload("index.html", htmlText, "text/html;charset=utf-8;");
          showToast("GitHub/Vercel 배포용 index.html 파일이 다운로드되었습니다.");
        };
        if (typeof fetch === "function" && window.location && window.location.protocol && window.location.protocol.indexOf("http") === 0) {
          fetch(window.location.href, { cache: "no-store" })
            .then(function (res) {
              if (!res.ok) throw new Error("http");
              return res.text();
            })
            .then(function (txt) {
              if (txt && txt.indexOf("<!DOCTYPE html") !== -1 && txt.indexOf("BalanceLab") !== -1) {
                done(txt);
              } else {
                done(buildCleanHtmlFallback());
              }
            })
            .catch(function () {
              done(buildCleanHtmlFallback());
            });
          return;
        }
        done(buildCleanHtmlFallback());
      }

          ];

          return;
        }
        if ((el = t.closest("[data-scan-time]"))) { state.scanMealTime = el.getAttribute("data-scan-time"); renderAll(); return; }
        if (t.closest("#btn-run-scan")) {
          if (!state.scanDesc.trim() && !state.scanImage) { showToast("음식 설명을 입력하거나 사진을 첨부해 주세요."); return; }
          state.scanScale = 1;
          state.scanResult = analyzeMealLocally(state.scanDesc, state.scanMealTime, state.scanOrder, !!state.scanImage);
          renderAll();
          return;
        }
        if ((el = t.closest("[data-scan-scale]"))) { state.scanScale = Number(el.getAttribute("data-scan-scale")); renderAll(); return; }
        if (t.closest("#btn-save-scan") && state.scanResult) {
          var r = state.scanResult;
          var sc = function (n) { return Math.round(n * state.scanScale); };
          addMealEntry({
            id: "meal-scan-" + Date.now(), date: todayDateStr(), timeLabel: nowTimeStr(),
            mealTime: state.scanMealTime, eatingOrder: state.scanOrder,
            title: state.scanScale === 1 ? r.mealTitle : r.mealTitle + " (" + state.scanScale + "배)",
            totalCalories: sc(r.totalCalories), totalCarbsG: sc(r.totalCarbsG), totalProteinG: sc(r.totalProteinG),
            totalFatG: sc(r.totalFatG), totalSugarG: sc(r.totalSugarG), totalSodiumMg: sc(r.totalSodiumMg),
            totalFiberG: sc(r.totalFiberG), glycemicRisk: r.glycemicRisk, satietyScore: r.satietyScore,
            orderImpactSummary: r.orderImpactSummary
          });
          state.activeTab = "dashboard";
          renderAll();
          return;
        }

        /* Fitness */
        if ((el = t.closest("[data-fit-tab]"))) { stopCameraStream(); state.fitnessSubTab = el.getAttribute("data-fit-tab"); renderAll(); return; }
        if ((el = t.closest("[data-body-type]"))) { state.bodyType = el.getAttribute("data-body-type"); state.workoutResult = null; renderAll(); return; }
        if ((el = t.closest("[data-fit-goal]"))) { state.fitnessGoal = el.getAttribute("data-fit-goal"); state.workoutResult = null; renderAll(); return; }
        if ((el = t.closest("[data-fit-min]"))) { state.fitDuration = Number(el.getAttribute("data-fit-min")); state.workoutResult = null; renderAll(); return; }
        if (t.closest("#btn-gen-workout")) {
          var sp = calculateExerciseSplit(state.bodyType, state.fitnessGoal, state.fitDuration);
          state.workoutResult = generateWorkoutRoutineLocally(state.bodyType, state.fitnessGoal, state.fitEnv, state.fitDuration, sp);
          state.workoutLogged = false;
          renderAll();
          return;
        }
        if (t.closest("#btn-log-workout") && state.workoutResult && !state.workoutLogged) {
          state.workoutLogged = true;
          addWalk(state.workoutResult.estimatedTotalMinutes);
          return;
        }
        if (t.closest("#btn-shuffle-variety")) { state.varietyShuffle += 1; renderAll(); return; }
        if ((el = t.closest("[data-genre-filter]"))) { state.genreFilter = el.getAttribute("data-genre-filter"); renderAll(); return; }
        if ((el = t.closest("[data-complete-var]"))) {
          var vid = el.getAttribute("data-complete-var");
          var item = EXERCISE_VARIETY_CATALOG.filter(function (x) { return x.id === vid; })[0];
          if (!item) return;
          var tday = todayDateStr();
          if (!state.dailyWorkouts.some(function (w) { return w.date === tday && w.id === vid; })) {
            state.dailyWorkouts.unshift({ id: vid, date: tday, title: item.title, minutes: item.durationMinutes });
            addWalk(item.durationMinutes);
            showToast("'" + item.title + "' 완료 (+25 XP)");
          }
          return;
        }
        if ((el = t.closest("[data-muscle-area]"))) { state.targetMuscleArea = el.getAttribute("data-muscle-area"); renderAll(); return; }
        if (t.closest("#btn-gen-muscle")) {
          var gTxt = state.customMuscleGoal.trim() || TARGET_MUSCLE_PROFILES.filter(function (p) { return p.key === state.targetMuscleArea; })[0].title;
          state.customMuscleResult = generateMuscleGuideLocally(gTxt, state.bodyType, state.muscleEnv);
          renderAll();
          return;
        }
        if ((el = t.closest("[data-combat-id]"))) { state.selectedCombatId = el.getAttribute("data-combat-id"); renderAll(); return; }
        if ((el = t.closest("[data-proj-id]"))) { state.selectedProjectId = el.getAttribute("data-proj-id"); renderAll(); return; }
        if ((el = t.closest("[data-toggle-session]"))) {
          var sid = el.getAttribute("data-toggle-session");
          var smin = Number(el.getAttribute("data-session-min")) || 15;
          var next = !state.completedSessions[sid];
          state.completedSessions[sid] = next;
          if (next) addWalk(smin);
          else { persistAll(); renderAll(); }
          return;
        }

        /* Posture & Camera */
        if (t.closest("#btn-pick-posture-img")) { document.getElementById("posture-file-input").click(); return; }
        if (t.closest("#btn-clear-posture-img")) { state.postureImage = null; renderAll(); return; }
        if (t.closest("#btn-toggle-cam")) {
          if (state.cameraActive) { stopCameraStream(); renderAll(); return; }
          state.cameraError = "";
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            state.cameraError = "이 브라우저에서는 실시간 카메라를 지원하지 않습니다. 사진 파일을 선택해 주세요.";
            renderAll(); return;
          }
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(function (stream) { cameraStream = stream; state.cameraActive = true; renderAll(); })
            .catch(function () { state.cameraError = "카메라 권한이 없거나 연결된 카메라가 없습니다. 사진 파일을 업로드해 주세요."; renderAll(); });
          return;
        }
        if (t.closest("#btn-capture-cam")) {
          var video = document.getElementById("posture-video");
          if (video) {
            var cv = document.createElement("canvas");
            cv.width = video.videoWidth || 640; cv.height = video.videoHeight || 480;
            cv.getContext("2d").drawImage(video, 0, 0, cv.width, cv.height);
            state.postureImage = cv.toDataURL("image/jpeg", 0.88);
          }
          stopCameraStream();
          renderAll();
          return;
        }
        if ((el = t.closest("[data-posture-ex]"))) { state.postureExercise = el.getAttribute("data-posture-ex"); renderAll(); return; }
        if (t.closest("#btn-analyze-posture")) {
          var exName = state.postureExercise === "직접 입력" ? (state.customPostureEx.trim() || "맨몸 운동") : state.postureExercise;
          state.postureResult = analyzePostureLocally(exName, state.discomfortNote, !!state.postureImage);
          renderAll();
          return;
        }

        /* Map */
        if ((el = t.closest("[data-map-mode]"))) {
          state.mapMode = el.getAttribute("data-map-mode");
          state.mapVerdictFilter = "all";
          state.selectedPlaceId = null;
          state.mapResult = buildDistrictGuide(state.mapAreaInput, state.mapMode, state.userCoords);
          renderAll();
          return;
        }
        if ((el = t.closest("[data-quick-area]"))) {
          state.mapAreaInput = el.getAttribute("data-quick-area");
          state.selectedPlaceId = null;
          state.mapResult = buildDistrictGuide(state.mapAreaInput, state.mapMode, null);
          renderAll();
          return;
        }
        if ((el = t.closest("[data-verdict-filter]"))) { state.mapVerdictFilter = el.getAttribute("data-verdict-filter"); renderAll(); return; }
        if ((el = t.closest("[data-select-place]"))) { state.selectedPlaceId = el.getAttribute("data-select-place"); renderAll(); return; }
        if (t.closest("#btn-geo-locate")) {
          state.geoError = "";
          if (!navigator.geolocation) {
            state.geoError = "이 브라우저에서는 위치 조회를 지원하지 않습니다. 동네나 역 이름을 입력해 주세요.";
            renderAll(); return;
          }
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              state.userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              state.mapAreaInput = "";
              state.selectedPlaceId = null;
              state.mapResult = buildDistrictGuide("", state.mapMode, state.userCoords);
              renderAll();
            },
            function () {
              state.geoError = "위치 권한이 거부되었거나 로컬 파일 모드 제한입니다. 위 검색창에 동네/지하철역을 입력해 주세요.";
              renderAll();
            },
            { enableHighAccuracy: false, timeout: 7000 }
          );
          return;
        }

        /* Rebalance */
        if ((el = t.closest("[data-emerg]"))) {
          var eid = el.getAttribute("data-emerg");
          state.checkedEmergency[eid] = !state.checkedEmergency[eid];
          persistAll();
          renderAll();
          return;
        }
        if ((el = t.closest("[data-reb-preset]"))) {
          state.triggerFood = el.getAttribute("data-reb-preset");
          state.excessCalories = Number(el.getAttribute("data-reb-kcal"));
          renderAll();
          return;
        }
        if (t.closest("#btn-gen-reb")) {
          var ctxR = getContext();
          state.rebalancePlan = generateRebalancePlanLocally(state.excessCalories, ctxR.targets.recommendedCalories, ctxR.targets.bmr, state.profile.age, state.triggerFood);
          state.loggedNeatIdx = null;
          renderAll();
          return;
        }
        if ((el = t.closest("[data-neat-idx]"))) {
          state.loggedNeatIdx = Number(el.getAttribute("data-neat-idx"));
          addWalk(Number(el.getAttribute("data-neat-min")) || 10);
          return;
        }

        /* Swaps */
        if ((el = t.closest("[data-swap-cat]"))) { state.swapCategory = el.getAttribute("data-swap-cat"); renderAll(); return; }
        if ((el = t.closest("[data-log-swap]"))) {
          var swId = el.getAttribute("data-log-swap");
          var sw = CURATED_KOREAN_SWAPS.filter(function (s) { return s.id === swId; })[0];
          if (!sw) return;
          var estC = Math.max(5, Math.round((sw.swapKcal - sw.swapProteinG * 4 - sw.swapKcal * 0.25) / 4));
          var estF = Math.max(2, Math.round((sw.swapKcal * 0.25) / 9));
          addMealEntry({
            id: "meal-swap-" + Date.now(), date: todayDateStr(), timeLabel: nowTimeStr(),
            mealTime: "저녁", eatingOrder: "거꾸로 식사(채소→단백질→탄수)",
            title: sw.swapTitle + " (" + sw.swapItems.join(" + ") + ")",
            totalCalories: sw.swapKcal, totalCarbsG: estC, totalProteinG: sw.swapProteinG, totalFatG: estF,
            totalSugarG: sw.swapSugarG, totalSodiumMg: 580, totalFiberG: 6,
            glycemicRisk: sw.swapSugarG <= 8 ? "낮음" : "보통", satietyScore: 8
          });
          return;
        }
        if ((el = t.closest("[data-log-cswap]")) && state.customSwapsResult) {
          var csw = state.customSwapsResult.swaps[Number(el.getAttribute("data-log-cswap"))];
          if (!csw) return;
          var c2 = Math.max(5, Math.round((csw.calories - csw.proteinG * 4 - csw.calories * 0.25) / 4));
          var f2 = Math.max(2, Math.round((csw.calories * 0.25) / 9));
          addMealEntry({
            id: "meal-cswap-" + Date.now(), date: todayDateStr(), timeLabel: nowTimeStr(),
            mealTime: "저녁", eatingOrder: "거꾸로 식사(채소→단백질→탄수)",
            title: csw.title + " (" + csw.items.join(" + ") + ")",
            totalCalories: csw.calories, totalCarbsG: c2, totalProteinG: csw.proteinG, totalFatG: f2,
            totalSugarG: csw.sugarG, totalSodiumMg: 580, totalFiberG: 6,
            glycemicRisk: csw.sugarG <= 8 ? "낮음" : "보통", satietyScore: 8
          });
          return;
        }

        /* Lab */
        if ((el = t.closest("[data-timer-mode]"))) {
          state.timerRunning = false;
          if (timerIntervalId) { clearInterval(timerIntervalId); timerIntervalId = null; }
          state.timerMode = el.getAttribute("data-timer-mode");
          state.secondsLeft = state.timerMode === "walk10" ? 600 : 1200;
          renderAll();
          return;
        }
        if (t.closest("#btn-timer-reset")) {
          state.timerRunning = false;
          if (timerIntervalId) { clearInterval(timerIntervalId); timerIntervalId = null; }
          state.secondsLeft = state.timerMode === "walk10" ? 600 : 1200;
          renderAll();
          return;
        }
        if (t.closest("#btn-timer-toggle")) {
          state.timerRunning = !state.timerRunning;
          if (state.timerRunning) {
            timerIntervalId = setInterval(function () {
              if (state.secondsLeft <= 1) {
                state.secondsLeft = 0; state.timerRunning = false;
                clearInterval(timerIntervalId); timerIntervalId = null;
                showToast("타이머가 완료되었습니다!");
                renderAll();
              } else {
                state.secondsLeft -= 1;
                var clk = document.getElementById("timer-clock");
                if (clk) clk.textContent = String(Math.floor(state.secondsLeft / 60)).padStart(2, "0") + ":" + String(state.secondsLeft % 60).padStart(2, "0");
              }
            }, 1000);
          } else if (timerIntervalId) {
            clearInterval(timerIntervalId); timerIntervalId = null;
          }
          renderAll();
          return;
        }
        if (t.closest("#btn-timer-log")) { addWalk(state.timerMode === "walk10" ? 10 : 5); return; }
        if (t.closest("#btn-dl-csv")) {
          var header = "날짜,섭취열량(kcal),단백질(g),당류(g),식후걷기(분)\n";
          var rows = [];
          for (var i = 0; i < 7; i++) {
            var ds = offsetDateStr(6 - i);
            var dm = state.meals.filter(function (m) { return m.date === ds; });
            var k = dm.reduce(function (s, m) { return s + m.totalCalories; }, 0);
            var prt = dm.reduce(function (s, m) { return s + m.totalProteinG; }, 0);
            var sg = dm.reduce(function (s, m) { return s + m.totalSugarG; }, 0);
            var wk = (state.habitsMap[ds] && state.habitsMap[ds].walkMinutes) || 0;
            rows.push(ds + "," + k + "," + prt + "," + sg + "," + wk);
          }
          var blob = new Blob(["\uFEFF" + header + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "balancelab-weekly-report.csv"; a.click();
          URL.revokeObjectURL(url);
          showToast("주간 리포트 CSV가 저장되었습니다.");
          return;
        }
        if (t.closest("#btn-gen-weekly")) {
          var ctxW = getContext();
          var actD = [];
          var wkSum = 0;
          for (var j = 0; j < 7; j++) {
            var dstr = offsetDateStr(6 - j);
            var dml = state.meals.filter(function (m) { return m.date === dstr; });
            if (dml.length) actD.push({ k: dml.reduce(function (s, m) { return s + m.totalCalories; }, 0), p: dml.reduce(function (s, m) { return s + m.totalProteinG; }, 0) });
            wkSum += (state.habitsMap[dstr] && state.habitsMap[dstr].walkMinutes) || 0;
          }
          var aK = Math.round(actD.reduce(function (s, x) { return s + x.k; }, 0) / Math.max(1, actD.length));
          var aP = Math.round(actD.reduce(function (s, x) { return s + x.p; }, 0) / Math.max(1, actD.length));
          var rCnt = state.meals.filter(function (m) { return m.eatingOrder === "거꾸로 식사(채소→단백질→탄수)"; }).length;
          var rRt = Math.round((rCnt / Math.max(1, state.meals.length)) * 100);
          state.weeklyInsight = generateWeeklyInsightLocally(aK, ctxW.targets.recommendedCalories, aP, ctxW.targets.proteinTargetG, rRt, wkSum);
          renderAll();
          return;
        }
      });

      document.addEventListener("input", function (e) {
        var t = e.target;
        if (t.id === "modal-search-in") {
          state.modalQuery = t.value;
          var q = state.modalQuery.trim().toLowerCase();
          var filtered = KOREAN_FOOD_PRESETS.filter(function (p) {
            return (state.modalCategory === "전체" || p.category === state.modalCategory) && (!q || p.item.name.toLowerCase().indexOf(q) !== -1);
          });
          var box = document.getElementById("modal-preset-list");
          if (box) box.innerHTML = buildModalPresetRows(filtered);
          return;
        }
        if (t.id === "scan-desc") { state.scanDesc = t.value; return; }
        if (t.id === "custom-muscle-in") { state.customMuscleGoal = t.value; return; }
        if (t.id === "custom-posture-ex") { state.customPostureEx = t.value; return; }
        if (t.id === "discomfort-in") { state.discomfortNote = t.value; return; }
        if (t.id === "map-area-input") { state.mapAreaInput = t.value; return; }
        if (t.id === "reb-food-in") { state.triggerFood = t.value; return; }
        if (t.id === "swap-craving-in") { state.cravingInput = t.value; return; }

        if (t.id === "reb-range") {
          state.excessCalories = Number(t.value);
          var v1 = document.getElementById("reb-excess-val"); if (v1) v1.textContent = "+" + fmt(state.excessCalories) + " kcal";
          var v2 = document.getElementById("reb-fat-val"); if (v2) v2.textContent = "+" + (state.excessCalories / 7700).toFixed(2) + " kg";
          var v3 = document.getElementById("reb-range-lbl"); if (v3) v3.textContent = fmt(state.excessCalories) + " kcal";
          return;
        }
        if (t.hasAttribute("data-sim")) {
          var kind = t.getAttribute("data-sim");
          if (kind === "carbs") state.simCarbs = Number(t.value);
          else if (kind === "fiber") state.simFiber = Number(t.value);
          else if (kind === "protein") state.simProtein = Number(t.value);
          updateGlucoseInPlace();
          return;
        }
        if (t.hasAttribute("data-prof")) {
          var field = t.getAttribute("data-prof");
          if (field === "name") state.profile.name = t.value;
          else if (field === "age") state.profile.age = Math.max(13, Math.min(85, Number(t.value) || 18));
          else if (field === "heightCm") state.profile.heightCm = Math.max(130, Math.min(215, Number(t.value) || 165));
          else if (field === "weightKg") state.profile.weightKg = Math.max(35, Math.min(180, Number(t.value) || 60));
          else if (field === "targetWeightKg") state.profile.targetWeightKg = Math.max(35, Math.min(180, Number(t.value) || 55));
          persistAll();
          updateProfileSummaryInPlace();
        }
      });

      document.addEventListener("change", function (e) {
        var t = e.target;
        if (t.id === "modal-order-sel") { state.modalOrder = t.value; return; }
        if (t.id === "scan-order-sel") { state.scanOrder = t.value; return; }
        if (t.id === "fit-env-sel") { state.fitEnv = t.value; state.workoutResult = null; renderAll(); return; }
        if (t.id === "muscle-body-sel" || t.id === "fit-body-sel") { state.bodyType = t.value; renderAll(); return; }
        if (t.id === "muscle-env-sel") { state.muscleEnv = t.value; renderAll(); return; }
        if (t.id === "swap-ctx-sel") { state.swapContext = t.value; return; }
        if (t.hasAttribute("data-prof")) {
          var field = t.getAttribute("data-prof");
          if (field === "gender" || field === "goalMode" || field === "activityLevel") {
            state.profile[field] = t.value;
            persistAll();
            renderAll();
          }
          return;
        }
        if (t.id === "scan-file-input" || t.id === "posture-file-input") {
          var file = t.files && t.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            if (t.id === "scan-file-input") state.scanImage = reader.result;
            else state.postureImage = reader.result;
            renderAll();
          };
          reader.readAsDataURL(file);
        }
      });

      document.addEventListener("submit", function (e) {
        var f = e.target;
        if (f.id === "map-search-form") {
          e.preventDefault();
          state.selectedPlaceId = null;
          state.mapResult = buildDistrictGuide(state.mapAreaInput.trim() || "강남역", state.mapMode, null);
          renderAll();
        } else if (f.id === "swap-form") {
          e.preventDefault();
          if (!state.cravingInput.trim()) { showToast("먹고 싶은 음식이나 상황을 입력해 주세요."); return; }
          var ctx = getContext();
          state.customSwapsResult = generateSmartSwapsLocally(state.cravingInput.trim(), state.swapContext, Math.max(200, ctx.remCal));
          renderAll();
        }
      });

      /* Initial Boot */
      renderAll();
    })();
  </script>
</body>
</html>
